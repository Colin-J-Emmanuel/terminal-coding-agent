llm:
  model: claude-sonnet-5
  max_tokens: 4000
  timeout: 60

safety:
  max_iterations: 20

context:
  summary_threshold: 20
  keep_recent: 6

cli:
  require_confirmation_for:
    - write_file
    - git_commit

tools:
  code_execution:
    timeout_seconds: 5
    max_memory_mb: 100
    max_cpu_time_seconds: 5

working_directory: "."

logging:
  level: INFO
  file: agent.log