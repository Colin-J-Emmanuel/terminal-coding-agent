llm:
  model: claude-sonnet-4-5
  max_tokens: 4000
  temperature: 0.7
  timeout: 60

safety:
  max_iterations: 20

cli:
  require_confirmation_for:
    - write_file

tools:
  code_execution:
    timeout_seconds: 5
    max_memory_mb: 100
    max_cpu_time_seconds: 5

working_directory: "."

logging:
  level: INFO
  file: agent.log